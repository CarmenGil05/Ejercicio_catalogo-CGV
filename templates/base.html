<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revista de Juguetes - {% block title %}{% endblock %}</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-red-700 shadow-md p-4 text-white">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="{{ url_for('catalogo.index') }}" class="text-2xl font-bold hover:text-red-200 transition duration-300">
                🎁 Catálogo Navideño de Juguetes
            </a>
            <nav>
                <a href="{{ url_for('catalogo.index') }}" class="ml-4 hover:text-red-200">Revista</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto py-8 px-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-200 p-4 mt-8 text-center text-gray-600">
        <p>Actividad Final de Flask - Desarrollado con Blueprints y Jinja2 para la temporada navideña.</p>
    </footer>
</body>
</html>
